openapi: 3.0.3
info:
  title: Customer Management API
  version: 1.0.0
  description: Contract for customer create, update, get details, and delete operations.
servers:
  - url: https://api.example.com
paths:
  /customers:
    post:
      summary: Create customer profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate customer conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /customers/{customerId}:
    get:
      summary: Get customer details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '400':
          description: Invalid customerId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update customer profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete customer profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '400':
          description: Invalid customerId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Deletion succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCustomerResponse'
        '403':
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Deletion blocked by dependency or retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateCustomerRequest:
      type: object
      required: [externalCustomerKey, legalName, primaryEmail]
      properties:
        externalCustomerKey:
          type: string
          maxLength: 120
        legalName:
          type: string
          maxLength: 160
        primaryEmail:
          type: string
          format: email
          maxLength: 255
        phoneNumber:
          type: string
          nullable: true
    UpdateCustomerRequest:
      type: object
      minProperties: 1
      properties:
        legalName:
          type: string
          maxLength: 160
        primaryEmail:
          type: string
          format: email
          maxLength: 255
        phoneNumber:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
    CustomerResponse:
      type: object
      required: [customerId, externalCustomerKey, legalName, primaryEmail, status, createdAtUtc, updatedAtUtc, createdByUserId, ownerUserId]
      properties:
        customerId:
          type: string
          format: uuid
        externalCustomerKey:
          type: string
        legalName:
          type: string
        primaryEmail:
          type: string
        phoneNumber:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
    DeleteCustomerResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [DELETED]
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
