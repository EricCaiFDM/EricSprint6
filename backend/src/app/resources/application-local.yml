spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bankingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:banking_app}
    password: ${DB_PASSWORD:banking_app}
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
